name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          environments: default

      - name: Lint
        run: pixi run --environment default ruff check src/

      - name: Format check
        run: pixi run --environment default ruff format --check src/
