name: Publish MS/MS demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check demo snapshot and merged viewer behavior
        run: |
          python -m unittest tests.test_demo_build -q
          node tests/viewer_merge_check.js
      - name: Build public demo from verified analysis snapshot
        run: python scripts/build_demo.py --snapshot demo/msms-structure-elucidation/source.json.gz
      - name: Add project landing page
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><title>MS/MS structure elucidation demo</title>
          <meta http-equiv="refresh" content="0;url=demo/msms-structure-elucidation/">
          <p><a href="demo/msms-structure-elucidation/">Explore the clinical unknowns demo</a></p>
          HTML
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
