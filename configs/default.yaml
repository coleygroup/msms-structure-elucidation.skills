# Shared defaults. Paths are relative to this file; override with CLI or environment.
models:
  simulator:
    ms_pred_src: ''  # clone ms-pred, then set this checkout path
    model: iceberg
    glacier_ckpt: ''  # Public MassSpecGym weights: see ms-pred README; licensed NIST weights can be supplied locally
    gen_ckpt: ''      # ICEBERG generator, when --model iceberg
    inten_ckpt: ''    # ICEBERG intensity, when --model iceberg
    collision_energies: [10, 20, 30, 40, 50]
    adduct: '[M+H]+'
    instrument: null  # use >instrumentation in .ms or --instrument
    cuda_devices: null
    batch_size: 1       # GPU anchors in msms-sim-iceberg SKILL.md: 8 GB -> 16, 24 GB -> 128
    num_cpu_workers: 1  # ms-pred featurization/preparation processes
    num_gpu_workers: 1  # ICEBERG model copies per job (GLACIER always 1)
    shard_size: 256
  retrieval:
    top_k: 10
    atlas_url: https://iceberg-ms.mit.edu
  batch:
    max_workers: auto   # batch worker processes; auto: up to 8 from CPU threads and RAM, setup saves a value
    max_model_jobs: 1
    min_free_memory_gb: 4
  denovo:
    frigid_src: .cache/FRIGID
    dlm_ckpt: ''
    mist_ckpt: ''
    iceberg_gen_ckpt: ''
    iceberg_inten_ckpt: ''
    top_k: 10
    num_rounds: 0   # FRIGID-base; set >0 when ICEBERG weights and GPU are available
    batch_size: 128
    cuda_devices: null
preprocessing:
  converter: msconvert
  output_format: mzML
feature_detect:
  mzmine_bin: ''
  mzmine_user: ''
