# Optional model settings. The atlas CLI takes paths as arguments or environment variables.
models:
  simulator:
    ms_pred_src: .cache/ms-pred
    model: glacier
    glacier_ckpt: ''  # Public MassSpecGym weights: see ms-pred README; licensed NIST weights can be supplied locally
    gen_ckpt: ''      # ICEBERG generator, when --model iceberg
    inten_ckpt: ''    # ICEBERG intensity, when --model iceberg
    collision_energies: [10, 20, 30, 40, 50]
    adduct: '[M+H]+'
    instrument: Orbitrap
    cuda_devices: null
  retrieval:
    top_k: 10
    atlas_url: https://iceberg-ms.mit.edu
  denovo:
    frigid_src: .cache/FRIGID
    dlm_ckpt: ''
    mist_ckpt: ''
    iceberg_gen_ckpt: ''
    iceberg_inten_ckpt: ''
    top_k: 10
    num_rounds: 0   # FRIGID-base; set >0 when ICEBERG weights and GPU are available
    batch_size: 128
    cuda_devices: null
preprocessing:
  converter: msconvert
  output_format: mzML
feature_detect:
  mzmine_bin: ''
  mzmine_user: ''
