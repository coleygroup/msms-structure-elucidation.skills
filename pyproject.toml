[project]
name = "snowmageddon"
version = "0.1.0"
description = "MS/MS structure elucidation agent using simulator, retrieval, and de novo models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "click",
]

[project.optional-dependencies]
cpu = []  # placeholder — add CPU-only model deps here when needed

[dependency-groups]
dev = ["ruff"]

[project.scripts]
snowmageddon = "snowmageddon.cli:main"

# Pixi workspace — one environment per model + one shared agent env
[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
snowmageddon = { path = ".", editable = true }

# Environments
# Each model gets its own isolated env. Fill in deps when you wire up a model.
# pixi run --environment <name> python ...

[tool.pixi.environments]
# Base agent env: shared utilities, CLI, orchestration
default = { features = ["agent"] }
# Raw file preprocessing (e.g. msconvert / pyteomics)
preprocess = { features = ["preprocess"] }
# ICEBERG simulator (ms-pred, DGL, PyTorch 2.4, Python 3.10)
simulator-iceberg = { features = ["simulator-iceberg"] }
# Generic simulator placeholder (fill in when a second simulator is added)
simulator = { features = ["simulator"] }
# Spectral database retrieval
retrieval = { features = ["retrieval"] }
# De novo structure prediction
denovo = { features = ["denovo"] }

# Feature dependency sets
[tool.pixi.feature.agent.dependencies]
python = ">=3.11"
pyyaml = "*"
click = "*"
pre-commit = "*"
ruff = "*"

[tool.pixi.feature.agent.pypi-dependencies]
anthropic = "*"
mcp = "*"

[tool.pixi.feature.preprocess.dependencies]
python = ">=3.10"
# TODO: add msconvert wrapper or pyteomics, pymzml, etc.
# pyteomics = "*"

# -- ICEBERG simulator (ms-pred from coleygroup/ms-pred) ---------------------
# Python 3.10 required by ms_pred and DGL 2.4
[tool.pixi.feature.simulator-iceberg.dependencies]
python = "3.10.*"
pytorch = { version = "2.4.0", channel = "pytorch" }
cython = "*"
matplotlib = "*"
rdkit = "*"
python-graphviz = "*"
pygraphviz = "*"
einops = "*"
seaborn = "*"
h5py = "*"

[tool.pixi.feature.simulator-iceberg.pypi-dependencies]
mcp = "*"
ipython = "*"
pytorch-lightning = "*"
ray = { version = "==2.7.2", extras = ["tune"] }
"setuptools" = "<81"
pydantic = "*"
scikit-learn = "*"
pathos = "*"
CairoSVG = "*"
omegaconf = "*"
pubchempy = "*"
pygmtools = "*"
msbuddy = "*"
lightgbm = "*"
platformdirs = "*"
pyyaml = "*"
numpy = "*"
# ms_pred, DGL, torch-scatter, torch-sparse must be installed manually after pixi install.
# Run: bash .agents/skills/msms-sim-iceberg/scripts/setup_env.sh

# -- Generic simulator placeholder -------------------------------------------
[tool.pixi.feature.simulator.dependencies]
python = ">=3.10"
# TODO: add deps for a second simulator when needed

[tool.pixi.feature.retrieval.dependencies]
python = ">=3.10"
# TODO: add retrieval deps (faiss, numpy, etc.)
# faiss-cpu = "*"
# numpy = "*"

[tool.pixi.feature.retrieval.pypi-dependencies]
mcp = "*"

[tool.pixi.feature.denovo.dependencies]
python = ">=3.10"
# TODO: add de novo model deps
# pytorch = {version = ">=2.0", channel = "pytorch"}

[tool.pixi.feature.denovo.pypi-dependencies]
mcp = "*"

[tool.pixi.tasks]
elucidation = "python -m snowmageddon.cli run"
