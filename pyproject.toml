[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msms-structure-elucidation"
version = "0.2.0"
description = "Portable MS/MS structure elucidation workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib"]
mcp = ["mcp"]
visualize = ["flask>=3.0"]

[project.scripts]
msms-structure-elucidation = "msms_structure_elucidation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msms_structure_elucidation = ["visualize_assets/*.html", "visualize_assets/*.css", "visualize_assets/*.js"]
