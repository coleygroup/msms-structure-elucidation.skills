# Packaged snapshot of configs/default.yaml for installations without a checkout.
models:
  simulator:
    ms_pred_src: ''
    python: ''
    model: iceberg
    glacier_ckpt: ''
    gen_ckpt: ''
    inten_ckpt: ''
    collision_energies: [10, 20, 30, 40, 50]
    adduct: '[M+H]+'
    instrument: null
    cuda_devices: null
    batch_size: 1
    num_cpu_workers: 1
    num_gpu_workers: 1
    shard_size: 256
  retrieval:
    top_k: 10
    atlas_url: https://iceberg-ms.mit.edu
  batch:
    max_workers: auto
    max_model_jobs: 1
    min_free_memory_gb: 4
  denovo:
    frigid_src: .cache/FRIGID
    frigid_python: ''
    dlm_ckpt: ''
    mist_ckpt: ''
    iceberg_gen_ckpt: ''
    iceberg_inten_ckpt: ''
    top_k: 10
    num_rounds: 0
    batch_size: 128
    cuda_devices: null
mcp:
  backend: local
  job_root: results/mcp_jobs
  wait_seconds: 600
  gpu_min_free_fraction: 0.8
  max_concurrent_jobs: auto
  slurm:
    partition: null
    account: null
    qos: null
    gpus: null
    cpus_per_task: null
    mem: null
    time: null
    requeue: false
    extra_args: []
    setup: []
    cpu:
      cpus_per_task: null
      mem: null
preprocessing:
  converter: msconvert
  output_format: mzML
feature_detect:
  mzmine_bin: ''
  mzmine_user: ''
