# Packaged snapshot of configs/default.yaml for installations without a checkout.
models:
  simulator:
    ms_pred_src: ''
    model: iceberg
    glacier_ckpt: ''
    gen_ckpt: ''
    inten_ckpt: ''
    collision_energies: [10, 20, 30, 40, 50]
    adduct: '[M+H]+'
    instrument: null
    cuda_devices: null
    batch_size: 1
    num_cpu_workers: 1
    num_gpu_workers: 1
    shard_size: 256
  retrieval:
    top_k: 10
    atlas_url: https://iceberg-ms.mit.edu
  batch:
    max_workers: auto
    max_model_jobs: 1
    min_free_memory_gb: 4
  denovo:
    frigid_src: .cache/FRIGID
    dlm_ckpt: ''
    mist_ckpt: ''
    iceberg_gen_ckpt: ''
    iceberg_inten_ckpt: ''
    top_k: 10
    num_rounds: 0
    batch_size: 128
    cuda_devices: null
preprocessing:
  converter: msconvert
  output_format: mzML
feature_detect:
  mzmine_bin: ''
  mzmine_user: ''
