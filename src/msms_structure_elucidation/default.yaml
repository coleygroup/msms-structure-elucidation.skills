# Shared defaults. Paths are relative to this file; override with CLI or environment.
models:
  simulator:
    ms_pred_src: ''  # clone ms-pred, then set this checkout path
    python: ''  # interpreter with ms_pred; empty: MS_PRED_PYTHON, then discovery
    model: iceberg
    glacier_ckpt: ''  # Public MassSpecGym weights: see ms-pred README; licensed NIST weights can be supplied locally
    gen_ckpt: ''      # ICEBERG generator, when --model iceberg
    inten_ckpt: ''    # ICEBERG intensity, when --model iceberg
    collision_energies: [10, 20, 30, 40, 50]
    adduct: '[M+H]+'
    instrument: null  # use >instrumentation in .ms or --instrument
    cuda_devices: null
    batch_size: 1       # GPU anchors in msms-predict SKILL.md: 8 GB -> 16, 24 GB -> 128
    num_cpu_workers: 1  # ms-pred featurization/preparation processes
    num_gpu_workers: 2  # ICEBERG: start 2 per GPU, tune 2-4; total across cuda_devices
    shard_size: 256
    reuse_predictions: true
    prediction_cache: ''  # empty: shared user cache on the model host
    glacier:  # GLACIER settings; generic batch/worker settings above apply to ICEBERG
      batch_size: 128
      num_cpu_workers: 4
      num_gpu_workers: 1
      prediction_processes_per_gpu: 1
      num_writers: 2
      num_h5_chunks: 4
      feat_cache_size: 256
      sparse_k: 100
  retrieval:
    top_k: 10
    atlas_url: https://iceberg-ms.mit.edu
    pubchem_formula_map: '' # optional HDF5; also discovered under the configured ms-pred data/retrieval/pubchem
  batch:
    max_workers: auto   # batch worker processes; auto: up to 8 from CPU threads and RAM, setup saves a value
    max_model_jobs: 1
    min_free_memory_gb: 4
  denovo:
    frigid_src: .cache/FRIGID
    frigid_python: ''  # interpreter of the FRIGID environment
    dlm_ckpt: ''
    mist_ckpt: ''
    iceberg_gen_ckpt: ''
    iceberg_inten_ckpt: ''
    top_k: 10
    num_rounds: 0   # FRIGID-base; set >0 when ICEBERG weights and GPU are available
    batch_size: 128
    cuda_devices: null
mcp:  # prediction server; setup writes host-specific values to configs/local.yaml
  backend: local          # local, slurm, kubernetes, or pool
  feature_pipeline: true  # backend CPU lists -> ready files -> shared prediction groups -> independent scoring
  feature_placement: workers # pool: whole requests stay on a worker; coordinator drains existing staged jobs
  approved_model_identities: {} # setup-pool records matching remote weight/native identities for a thin coordinator
  feature_cpu_workers: 3  # legacy total; ignored when explicit preparation/scoring counts are set
  feature_preparation_workers: auto # legacy split; setup saves 2 preparation services per GPU
  feature_scoring_workers: null # explicit scoring services; setup saves ceil(GPU slots / 2); null uses legacy total
  feature_worker_idle_seconds: 60 # reuse CPU workers for new lists and scoring before releasing their allocation
  feature_prediction_groups: auto # two queued prediction groups per endpoint slot
  feature_group_builds_per_tick: 2 # yield to GPU dispatch and collection between large group builds
  feature_queue_cache_mb: 64 # SQLite page cache per feature-driver connection; tune on large queues
  feature_cpu_output: true # decode native HDF5 and publish cache in CPU output jobs after GPU release
  feature_output_workers: auto # bounded output services; setup saves one per GPU slot
  feature_output_idle_seconds: 60 # finite reuse window for CPU output allocations
  job_root: results/mcp_jobs  # relative to the checkout
  wait_seconds: 600       # tools wait this long for a result before returning a job id
  gpu_monitor_interval_seconds: 1  # sampled allocated-task activity; 0 disables recording
  gpu_min_free_fraction: 0.8  # a GPU is free when idle with this fraction of its memory free
  gpu_devices: null        # optional list of physical GPU indices; null allows all detected GPUs
  max_concurrent_jobs: auto  # GPU job limit; auto: one per GPU, or one on CPU-only hosts
  max_cpu_jobs: auto       # preparation + scoring + output services; optional explicit host cap
  cpu_preparation_workers: auto # GLACIER entry preparation respects CPU allocation; GPU featurization stays tuned separately
  scheduler_process: true # one detached local scheduler; workers only publish state
  max_live_pipelines: auto # cap running/waiting CPU processes; auto: CPU slots + prepared limit
  route_canary: true      # one successful PubChem route request before expanding a new environment
  environment_failure_limit: 3 # hold new pipeline admissions for repeated environment errors
  worker_environment: {}  # e.g. verified SSL_CERT_FILE; GPU visibility belongs to the scheduler
  min_free_memory_gb: 2    # RAM admission floor for new local CPU jobs, when measurable
  max_prepared_jobs: auto  # pause new CPU preparations at two waiting parents per GPU (at least two)
  prediction_group_size: auto  # measured rate × target duration; fallback 4096 candidates; GPU batch is separate
  target_prediction_seconds: 600  # scheduling hint, not a minimum runtime or latency
  prediction_group_spectra: 131072 # unique structure/actual-energy pairs per bulk GPU job
  prediction_group_min_spectra: 100001 # bulk goal; small requests and final remainders run below this
  prediction_small_job_spectra: 10000 # small-workload classification, never pad requested spectra
  prediction_coalesce_seconds: 60 # flush an undersized ready pool after growth stops
  prediction_coalesce_max_seconds: 300 # bounded wait while CPU preparation continues
  max_group_candidates: 131072 # structure ceiling for a prepared work group
  prepared_groups: auto    # two groups per endpoint slot, capped at eight per orchestrator
  coordinator_backend: local  # pool CPU orchestrators: local or slurm
  poll_seconds: 15         # endpoint inventory refresh interval
  pool_async_dispatch: true # endpoint RPC and collection run outside the scheduling tick
  pool_rpc_workers: 4      # bounded endpoint control operations
  pool_rpc_workers_per_server: 2 # isolated per resource_group; 0 shares the RPC executor
  pool_submission_workers: 2 # independent execution-write capacity in shared mode
  pool_submission_workers_per_server: 1 # independent write worker per resource_group
  pool_transfer_workers: 2 # independent artifact transfer capacity
  pubchem_cache_ttl_seconds: 86400 # analysis-local complete response snapshots; 0 disables reuse
  servers: {}             # named private endpoints; see docs/prediction-servers.md
  kubernetes: {}          # explicit context, namespace, pinned runtime image and shared storage
  slurm:  # every unset key is left out of sbatch
    partition: null
    account: null
    qos: null
    gpus: null            # --gpus value, for example 1 or <type>:1
    cpus_per_task: null
    mem: null
    time: null
    requeue: false
    extra_args: []        # further sbatch arguments
    setup: []             # shell lines run before the job, such as environment activation
    cpu:                  # resources for CPU preparation/scoring orchestrators and CPU-only tasks
      cpus_per_task: null
      mem: null
preprocessing:
  converter: msconvert
  output_format: mzML
pipeline:
  reuse_answers: true
  formula_search:
    strategy: buddy_top3  # recommendation; ask once unless the user already selected a route
    elements: CHNOPSClBrFISiBSe
  answers: {}  # verified answers belong in the uncommitted local config, scoped by project/dataset
  evidence_review:
    mode: auto  # delegate batch evidence reviews when supported; otherwise review in the main agent
    max_reviewers: 2  # bounded by available agent slots; keep the main agent monitoring jobs
    features_per_task: 1
feature_detect:
  backend: everything_bagel  # recommended first-run choice; ask once if no feature list or saved answer
  everything_bagel:
    interface: auto  # browser for suitable local files, GNPS2 for server-side processing
  custom:
    instructions: ''  # user-supplied workflow or feature-table/MGF handoff
  mzmine_bin: ''
  mzmine_user: ''
